name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    # Never run pull-request code on the production/self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa
      - run: npm run test:map
      - run: npm run test:tasks
      - run: python3 -m unittest discover -s test -p '*_test.py' -v

  container:
    needs: test
    runs-on: ubuntu-latest
    env:
      PUBLIC_ORIGIN: https://scaletag.test
      SCALETAG_IMAGE: scaletag:container-test
      SYSTEM_UPDATE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: docker compose config --quiet
      - run: docker compose build --pull
      - run: npm run test:container

  ha:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: docker build --pull --tag scaletag:ha-test .
      - name: Test shared SQLite, Nginx failover, failback and rolling deployment
        run: npm run test:ha
