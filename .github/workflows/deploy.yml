name: Deploy HA demo
on:
  workflow_run:
    workflows: [Test]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scaletag-development
  cancel-in-progress: false
jobs:
  deploy:
    if: >-
      github.repository == 'ChrisXHLeung/ScaleTag' &&
      ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') ||
       (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, Linux, X64]
    env:
      DEPLOY_REVISION: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Confirm dedicated runner
        run: test "$RUNNER_NAME" = eons
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_REVISION }}
          persist-credentials: false
      - name: Reject stale deployments and require HA bootstrap
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$DEPLOY_REVISION"
          test -f /etc/scaletag-ha/enabled
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Update app2, fail over, update app1 and verify automatic failback
        run: bash deploy/deploy.sh
