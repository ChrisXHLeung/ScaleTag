name: scaletag-ha
x-app: &app
  image: ${APP1_IMAGE:-scaletag:local}
  init: true
  user: "${SCALETAG_UID:-1000}:${SCALETAG_GID:-1000}"
  environment: &app-env
    NODE_ENV: production
    PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
    HOST: 0.0.0.0
    PORT: "3000"
    DATA_DIR: /data
    STORAGE_BACKEND: sqlite
    MAX_POLLS: ${MAX_POLLS:-10000}
    MAX_VOTES_PER_POLL: ${MAX_VOTES_PER_POLL:-50000}
    CREATE_LIMIT_PER_MINUTE: ${CREATE_LIMIT_PER_MINUTE:-20}
  volumes:
    - "${SCALETAG_DATA_SOURCE:-ha-data}:/data"
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 256m
  memswap_limit: 256m
  pids_limit: 64
  ulimits:
    core: 0
  restart: unless-stopped
  stop_grace_period: 15s
  logging: &logging
    driver: local
    options: {max-size: 5m, max-file: "2"}
services:
  app1:
    <<: *app
    environment:
      <<: *app-env
      INSTANCE_ID: app1
      APP_REVISION: ${APP1_REVISION:-local}
  app2:
    <<: *app
    image: ${APP2_IMAGE:-scaletag:local}
    environment:
      <<: *app-env
      INSTANCE_ID: app2
      APP_REVISION: ${APP2_REVISION:-local}
  ingress:
    image: nginx:stable-alpine
    # This is the ingress. The existing host cloudflared points here, never
    # to an application slot. No tunnel credentials enter this project.
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "127.0.0.1:${SCALETAG_PORT:-3000}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 32m
    memswap_limit: 32m
    pids_limit: 32
    restart: unless-stopped
    stop_grace_period: 20s
    logging: *logging
volumes:
  ha-data:
