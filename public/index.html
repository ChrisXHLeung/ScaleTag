<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183d32" />
    <meta
      name="description"
      content="A question. A place. Seven days. Create a simple, anonymous poll and share it with a QR code."
    />
    <title>ScaleTag — Small questions. Local voices.</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" type="module"></script>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="header-inner">
        <a href="/" class="brand"
          ><span class="brand-mark" aria-hidden="true">↗</span>ScaleTag<span
            class="version"
            >BETA</span
          ></a
        >
        <nav aria-label="Main navigation">
          <a href="/create" data-nav="create">Create a poll</a
          ><a href="/VoteList" data-nav="list"
            >VoteList <span aria-hidden="true">↗</span></a
          >
        </nav>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div class="loading-state" role="status">Loading ScaleTag…</div>
    </main>
    <footer class="site-footer">
      <div>
        <a href="/" class="footer-brand"
          >ScaleTag<span aria-hidden="true">↗</span></a
        >
        <p>A question. A place. Seven days.</p>
      </div>
      <div class="footer-links">
        <a href="/privacy">Privacy &amp; retention</a
        ><a
          href="https://github.com/ChrisXHLeung/ScaleTag"
          target="_blank"
          rel="noopener noreferrer"
          >GitHub ↗</a
        ><span>Made for small conversations.</span>
      </div>
    </footer>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <noscript
      ><p class="notice">
        ScaleTag needs JavaScript for location, voting, and QR codes. Please
        enable it to continue.
      </p></noscript
    >
  </body>
</html>
