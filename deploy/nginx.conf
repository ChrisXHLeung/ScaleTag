worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_shutdown_timeout 15s;
events { worker_connections 256; }
http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Docker service addresses may change when a slot is replaced.
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 1s;
    upstream scaletag {
        zone scaletag 64k;
        server app1:3000 resolve max_fails=1 fail_timeout=5s;
        server app2:3000 resolve backup max_fails=1 fail_timeout=5s;
        keepalive 8;
    }
    server {
        listen 8080;
        client_max_body_size 24k;
        location / {
            proxy_pass http://scaletag;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            # Never add non_idempotent: a sent POST may already be committed.
            proxy_cache off;
        }
    }
}
